name: Cargar o actualizar contenido

# Se ejecuta SOLO a mano: GitHub → Actions → "Cargar o actualizar contenido" → Run workflow.
# 1) Si la base está vacía, carga el contenido inicial.
# 2) Aplica las actualizaciones de contenido (v2) sin pisar lo editado en el panel.
# Nunca borra registros. Se puede ejecutar las veces que quieras.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargar-contenido
  cancel-in-progress: false

jobs:
  cargar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Único secreto necesario. Se guarda en Settings → Secrets and variables → Actions.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TOTP_DISABLED: 'false'
    steps:
      - name: Comprobar que existe el secreto DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Falta el secreto DATABASE_URL en Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Clave temporal para esta corrida (no se guarda)
        run: |
          echo "PAYLOAD_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "RATE_LIMIT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Aplicar migraciones (si falta alguna)
        run: pnpm migrate
      - name: Contenido inicial (solo si la base está vacía)
        run: pnpm seed
      - name: Actualizaciones de contenido (v2)
        run: pnpm contenido
      - name: Siguiente paso
        run: |
          echo "### Contenido listo" >> "$GITHUB_STEP_SUMMARY"
          echo "Entra al panel → Contenido → **Perfil** y pulsa **Guardar** (sin cambiar nada) para que el sitio muestre el contenido de inmediato." >> "$GITHUB_STEP_SUMMARY"
