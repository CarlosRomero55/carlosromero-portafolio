name: Respaldo semanal de la base

# Cada lunes a las 03:17 (Guayaquil) y cuando quieras desde Actions → "Respaldo semanal de la base" → Run workflow.
# Copia la base de Neon, comprueba que se puede restaurar, la cifra (AES-256) y la guarda
# en un repositorio PRIVADO aparte. Nunca se guarda en este repositorio público ni como artifact.
# Guía para configurarlo y para restaurar: docs/RESPALDO.md
on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: respaldo
  cancel-in-progress: false

jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      prueba:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: prueba
          POSTGRES_DB: prueba
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      RESPALDO_TOKEN: ${{ secrets.RESPALDO_TOKEN }}
      RESPALDO_REPO: ${{ vars.RESPALDO_REPO || 'CarlosRomero55/portafolio-respaldos' }}
      PRUEBA_URL: postgresql://postgres:prueba@localhost:5432/prueba
      CONSERVAR: '12'
    steps:
      - name: Comprobar los secretos
        run: |
          # Quita espacios y saltos de línea que se cuelan al pegar el secreto.
          limpio=$(printf '%s' "$RESPALDO_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$limpio"
          echo "RESPALDO_TOKEN=$limpio" >> "$GITHUB_ENV"
          falta=0
          for s in DATABASE_URL BACKUP_PASSPHRASE RESPALDO_TOKEN; do
            if [ -z "${!s}" ]; then echo "::error::Falta el secreto $s (ver docs/RESPALDO.md)."; falta=1; fi
          done
          exit $falta

      - name: El repositorio de respaldos debe ser privado
        run: |
          privado=$(curl -fsS -H "Authorization: Bearer $RESPALDO_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$RESPALDO_REPO" | jq -r '.private') || {
            echo "::error::No se pudo abrir $RESPALDO_REPO con RESPALDO_TOKEN. Revisa que el repositorio exista y que el token tenga acceso a él."; exit 1; }
          if [ "$privado" != "true" ]; then
            echo "::error::$RESPALDO_REPO no es privado. No se guarda nada ahí."; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # Sin esto, la credencial de este repo público se impone al token del repo de respaldos.
          persist-credentials: false

      - name: Instalar el cliente de PostgreSQL 18
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-18 >/dev/null
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Copiar, comprobar y cifrar
        id: copia
        run: |
          echo "::add-mask::${DATABASE_URL/-pooler./.}"
          mkdir -p salida
          archivo=$(SALIDA_DIR=salida bash scripts/respaldo.sh | tail -n 1)
          echo "archivo=$archivo" >> "$GITHUB_OUTPUT"

      - name: Guardar en el repositorio privado
        run: |
          cd "$RUNNER_TEMP"
          git clone -q --depth 1 "https://x-access-token:${RESPALDO_TOKEN}@github.com/${RESPALDO_REPO}.git" destino 2>err.txt || {
            sed 's#https://[^@]*@#https://***@#g' err.txt; echo "::error::No se pudo clonar $RESPALDO_REPO."; exit 1; }
          rm -f err.txt
          mkdir -p destino/respaldos
          cp "$GITHUB_WORKSPACE"/salida/* destino/respaldos/
          cd destino
          # Conserva solo los últimos $CONSERVAR respaldos.
          ls -1 respaldos/*.dump.gpg | sort | head -n -"$CONSERVAR" | while read -r viejo; do
            git rm -q "$viejo" "${viejo%.gpg}.txt" 2>/dev/null || true
          done
          git config user.name "respaldo-portafolio"
          git config user.email "respaldo@users.noreply.github.com"
          git add respaldos
          git commit -qm "Respaldo $(date -u +%Y-%m-%d)"
          git push -q origin HEAD

      - name: Resumen
        run: |
          {
            echo "### Respaldo guardado"
            echo "- Archivo: \`$(basename "${{ steps.copia.outputs.archivo }}")\` en el repositorio privado"
            echo "- Contenido comprobado: $(cat salida/*.txt)"
            echo "- Se conservan los últimos $CONSERVAR respaldos."
          } >> "$GITHUB_STEP_SUMMARY"
