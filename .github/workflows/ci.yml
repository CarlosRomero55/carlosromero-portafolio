name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 11 * * 1' # lunes: auditoría semanal

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (todo el historial)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: portafolio }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/portafolio
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_NOINDEX: 'true'
      # Claves de prueba públicas de Cloudflare (siempre aprueban)
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      E2E_CONTACTO: '1'
    steps:
      - name: Claves temporales para esta corrida (no son secretos reales)
        run: |
          echo "PAYLOAD_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "RATE_LIMIT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Auditoría de dependencias (falla con críticas)
        run: pnpm audit --audit-level critical --prod
      - run: pnpm typecheck
      - run: pnpm test:unit
      - name: Migraciones y datos de prueba
        run: pnpm migrate && pnpm seed && pnpm contenido && PUBLICAR_INGLES=true PUBLICAR_ARTICULO=true pnpm contenido:v3 && PUBLICAR_INGLES=true pnpm contenido:v4
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Pruebas e2e, accesibilidad y seguridad
        run: pnpm test:e2e
      - name: Barrido de datos internos
        run: |
          pnpm start & npx wait-on http://localhost:3000/es
          pnpm test:scan
      - name: Peso de JS de la portada (< 150 KB comprimido)
        run: node scripts/peso-portada.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
